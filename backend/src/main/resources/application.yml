spring:
  application:
    name: blog-backend

  # 使用 H2 文件数据库（数据持久化到磁盘，重启不丢失）
  # 生产环境建议使用 MySQL，配置见 .env.example
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/blog;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  sql:
    init:
      mode: never  # 禁用自动初始化（由 DatabaseInit 手动处理）

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:blog-jwt-secret-key-2024-personal-blog-system-with-enough-length-for-security}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.blog: debug

ai:
  api-key: ${AI_API_KEY:sk-a9b17b03f8aa45b288322ec0797f8e57}
  model: qwen-turbo
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
