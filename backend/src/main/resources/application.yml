spring:
  application:
    name: blog-backend

  # 使用 H2 内存数据库（MySQL 兼容模式）
  datasource:
    url: jdbc:h2:mem:blog;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never  # 禁用自动初始化（由 DatabaseInit 手动处理）

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

jwt:
  secret: blog-jwt-secret-key-2024-personal-blog-system
  expiration: 86400000

logging:
  level:
    com.blog: debug
